<ul class="nav nav-tabs" id="videoTabs" role="tablist">
  {% if page.vkvideo %}
  <li class="nav-item" role="presentation">
    <button class="nav-link active" id="vk-tab"
            data-bs-toggle="tab" data-bs-target="#vk-pane"
            type="button" role="tab"
            aria-controls="vk-pane" aria-selected="true">
      VK Video
    </button>
  </li>
  {% endif %}
  {% if page.youtube %}
  <li class="nav-item" role="presentation">
    <button class="nav-link{% unless page.vkvideo %} active{% endunless %}" id="youtube-tab"
            data-bs-toggle="tab" data-bs-target="#youtube-pane"
            type="button" role="tab"
            aria-controls="youtube-pane" aria-selected="{% if page.vkvideo %}false{% else %}true{% endif %}">
      YouTube
    </button>
  </li>
  {% endif %}
</ul>

<div class="tab-content mt-3" id="videoTabsContent">
  {% if page.vkvideo %}
  <div class="tab-pane fade show active" id="vk-pane"
       role="tabpanel" aria-labelledby="vk-tab">
    <div class="ratio ratio-16x9">
      <iframe src="https://vkvideo.ru/video_ext.php?{{ page.vkvideo }}"
              title="VK Video"
              allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
              allowfullscreen></iframe>
    </div>
  </div>
  {% endif %}
  {% if page.youtube %}
  <div class="tab-pane fade{% unless page.vkvideo %} show active{% endunless %}" id="youtube-pane"
       role="tabpanel" aria-labelledby="youtube-tab">
    <div class="ratio ratio-16x9">
      <iframe src="https://www.youtube.com/embed/{{ page.youtube }}"
              title="YouTube video"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen></iframe>
    </div>
  </div>
  {% endif %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
