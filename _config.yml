title: "dev praktika: воркшопы для программистов"
lang: ru
url: https://devpraktika.ru
future: true
timezone: Europe/Moscow

collections:
  educators:
    output: true
    permalink: /educators/:slug/
  workshops:
    output: true
    permalink: /workshops/:slug/

defaults:
  - scope:
      path: ""
      type: "educators"
    values:
      layout: "educator"
  - scope:
      path: ""
      type: "workshops"
    values:
      layout: "workshop"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "event"
      permalink: /events/:year-:month-:day-:slug/