---
layout: default
title: UTM-генератор
---

{% assign upcoming_events = site.posts
                          | where_exp: "event", "event.date >= site.time"
                          | where_exp: "event", "event.networkly_id != nil"
                          | sort: "date" %}

<div class="mb-3">
  <div class="mb-3">
    <label class="form-label" for="source">utm_source</label>
    <select class="form-select" id="source">
      <option value="devpraktika.ru">devpraktika.ru&nbsp;&mdash; сайт</option>
      <option value="telegram">telegram&nbsp;&mdash; Tg networkly</option>
      <option value="tg_devpraktika">tg_devpraktika</option>
      <option value="tg_progmsk">tg_progmsk</option>
      <option value="tg_anton0xf">tg_anton0xf</option>
      <option value="tg_3g">tg_3g&nbsp;&mdash; Три Дже Дая</option>
      <option value="vk_progmsk">vk_progmsk</option>
      <option value="vk_devpraktika">vk_devpraktika</option>
      <option value="calendar">calendar&nbsp;&mdash; календарь progmsk</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label" for="campaign">utm_campaign</label>
    <select class="form-select" id="campaign">
      {% for event in upcoming_events %}
      <option value="event_{{ event.networkly_id }}_announcement"
              data-url="https://networkly.app/event/{{ event.networkly_id }}">
        {{ event.date | date: '%d.%m.%Y' }} — {{ event.title | escape }}
      </option>
      {% endfor %}
    </select>
  </div>
</div>

<p><a id="link"></a></p>

<script>
function updateLink() {
  const source = document.getElementById('source').value;
  var medium = 'social';
  if (source == 'devpraktika.ru') medium = 'organic';
  const campaign = document.getElementById('campaign');
  const eventUrl = campaign.selectedOptions[0]?.dataset.url ?? '';
  const linkElement = document.getElementById('link');

  const url = `${eventUrl}?utm_source=${encodeURIComponent(source)}&utm_medium=${encodeURIComponent(medium)}&utm_campaign=${encodeURIComponent(campaign.value)}`;
  linkElement.href = url;
  linkElement.textContent = url;
}

document.getElementById('source').addEventListener('change', updateLink);
document.getElementById('campaign').addEventListener('change', updateLink);

updateLink();
</script>
