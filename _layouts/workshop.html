---
layout: default
---

<div class="row w-100">
  <div class="col-12">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% link workshops/index.md %}">Воркшопы</a></li>
        <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
      </ol>
    </nav>
  </div>
</div>

<div class="row w-100">
  <div class="bg-white col-12">
    <h1>{{ page.title }}</h1>

    {% if page.image %}
    <p><img class="workshop float-start me-2 mb-2"
            width="640"
            height="640"
            src="{{ page.image }}"
            alt="{{ page.title }}"
        /></p>
    {% endif %}

    {{ content }}
  </div>
</div>
